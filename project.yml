name: PDFview
options:
  bundleIdPrefix: com.pdfview
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.8"
    CURRENT_PROJECT_VERSION: "2"

targets:
  PDFview-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/DuokanPDFViewer
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: PDFview
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfview.ios
        INFOPLIST_FILE: Resources/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RZDYMBJGF9

  PDFview-macOS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/DuokanPDFViewer
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: PDFview
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfview.macos
        INFOPLIST_FILE: Resources/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  PDFview-iOS:
    build:
      targets:
        PDFview-iOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  PDFview-macOS:
    build:
      targets:
        PDFview-macOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
